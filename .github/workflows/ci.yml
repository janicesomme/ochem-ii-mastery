name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/studyos-vercel-clean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: https://wrsbykcmcoyemjnsdgrk.supabase.co
          VITE_SUPABASE_PROJECT_ID: wrsbykcmcoyemjnsdgrk
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EWGNQAeRoLq0HiN2AIvA1g_D-Qg4Mqd
          SUPABASE_URL: https://wrsbykcmcoyemjnsdgrk.supabase.co
          SUPABASE_PROJECT_ID: wrsbykcmcoyemjnsdgrk
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_EWGNQAeRoLq0HiN2AIvA1g_D-Qg4Mqd
        run: bun run build
